spring:
  application:
    name: market-data-service-test

clients:
  twelve-data:
    base-url: https://api.twelvedata.com
    price-path: /price
    quote-path: /quote
    time-series-path: /time_series
    api-key: test-api-key
    connect-timeout: 100ms
    request-timeout: 100ms
    max-retries: 2
    retry-backoff: 10ms
    default-interval: 4min
  resources:
    base-url: http://localhost:${mock.provider.port}
    resources-path: /external-api/resources
    lower-left-lat-lon: 40.4168,-3.7038
    upper-right-lat-lon: 40.4268,-3.6938
    company-zone-ids:
      - 100
      - 101
      - 102
    user-agent: market-data-service-test/1.0
    request-timeout: 100ms
    max-retries: 2
    retry-backoff: 10ms
mock:
  provider:
    enabled: true
    port: 18089
    min-vehicles-per-response: 1
    max-vehicles-per-response: 2
    min-vehicles-changed-per-refresh: 0
    max-vehicles-changed-per-refresh: 1
    min-response-duration-seconds: 1
    max-response-duration-seconds: 1

vehicle:
  polling:
    enabled: false
