spring:
  application:
    name: market-data-service
  config:
    import:
      - optional:file:./application-local.properties
      - optional:file:../../application-local.properties
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

clients:
  twelve-data:
    base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
    price-path: ${TWELVE_DATA_PRICE_PATH:/price}
    quote-path: ${TWELVE_DATA_QUOTE_PATH:/quote}
    time-series-path: ${TWELVE_DATA_TIME_SERIES_PATH:/time_series}
    api-key: ${TWELVE_DATA_API_KEY}
    connect-timeout: ${TWELVE_DATA_CONNECT_TIMEOUT:5s}
    request-timeout: ${TWELVE_DATA_REQUEST_TIMEOUT:10s}
    max-retries: ${TWELVE_DATA_MAX_RETRIES:2}
    retry-backoff: ${TWELVE_DATA_RETRY_BACKOFF:500ms}
    default-interval: ${TWELVE_DATA_DEFAULT_INTERVAL:4min}
  resources:
    base-url: ${VEHICLE_RESOURCES_BASE_URL:http://localhost:${mock.provider.port}}
    resources-path: ${VEHICLE_RESOURCES_PATH:/external-api/resources}
    lower-left-lat-lon: ${VEHICLE_RESOURCES_LOWER_LEFT_LAT_LON:40.4168,-3.7038}
    upper-right-lat-lon: ${VEHICLE_RESOURCES_UPPER_RIGHT_LAT_LON:40.4268,-3.6938}
    company-zone-ids:
      - 100
      - 101
      - 102
    user-agent: ${VEHICLE_RESOURCES_USER_AGENT:vehicle-availability-service/1.0}
    request-timeout: 5s
    max-retries: 2
    retry-backoff: 500ms

vehicle:
  polling:
    enabled: true
    fixed-delay: 90s
    initial-delay: 0s

mock:
  provider:
    enabled: true
    port: 8089
    min-vehicles-per-response: 20
    max-vehicles-per-response: 50
    min-vehicles-changed-per-refresh: 0
    max-vehicles-changed-per-refresh: 8
    min-response-duration-seconds: 20
    max-response-duration-seconds: 180

