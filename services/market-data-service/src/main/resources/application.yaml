spring:
  application:
    name: market-data-service
  config:
    import:
      - optional:file:./application-local.properties
      - optional:file:../../application-local.properties
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      group-id: ${KAFKA_CONSUMER_GROUP_ID:market-data-service-active-symbol-changes}
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tychewealth.kafka.events
    producer:
      client-id: ${KAFKA_PRODUCER_CLIENT_ID:market-data-service}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

clients:
  twelve-data:
    base-url: ${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
    price-path: ${TWELVE_DATA_PRICE_PATH:/price}
    quote-path: ${TWELVE_DATA_QUOTE_PATH:/quote}
    time-series-path: ${TWELVE_DATA_TIME_SERIES_PATH:/time_series}
    api-key: ${TWELVE_DATA_API_KEY}
    connect-timeout: ${TWELVE_DATA_CONNECT_TIMEOUT:5s}
    request-timeout: ${TWELVE_DATA_REQUEST_TIMEOUT:10s}
    max-retries: ${TWELVE_DATA_MAX_RETRIES:2}
    retry-backoff: ${TWELVE_DATA_RETRY_BACKOFF:500ms}
    default-interval: ${TWELVE_DATA_DEFAULT_INTERVAL:4min}
  resources:
    base-url: ${VEHICLE_RESOURCES_BASE_URL:http://localhost:${mock.provider.port}}
    resources-path: ${VEHICLE_RESOURCES_PATH:/external-api/resources}
    lower-left-lat-lon: ${VEHICLE_RESOURCES_LOWER_LEFT_LAT_LON:40.4168,-3.7038}
    upper-right-lat-lon: ${VEHICLE_RESOURCES_UPPER_RIGHT_LAT_LON:40.4268,-3.6938}
    company-zone-ids:
      - 100
      - 101
      - 102
    user-agent: ${VEHICLE_RESOURCES_USER_AGENT:vehicle-availability-service/1.0}
    request-timeout: 5s
    max-retries: 2
    retry-backoff: 500ms

kafka:
  enabled: ${KAFKA_ENABLED:true}

app:
  kafka:
    listener:
      retry-interval-ms: ${KAFKA_LISTENER_RETRY_INTERVAL_MS:1000}
      retry-attempts: ${KAFKA_LISTENER_RETRY_ATTEMPTS:2}
    dlt:
      suffix: ${KAFKA_DLT_SUFFIX:-dlt}
    topics:
      active-symbol-changes: ${KAFKA_TOPIC_ACTIVE_SYMBOL_CHANGES:active-symbol-changes}

