# Default port
server.port=8082

spring.application.name=portfolio-service

# Optional import of unversioned local configuration.
# Support both running from the module directory and from the repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:../../application-local.properties

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog/changelog-master.xml

# PostgreSQL configuration
spring.datasource.url=${DB_URL_PORTFOLIO}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT
app.auth.jwt.secret=${JWT_SECRET}

# AI / Ollama
app.ai.base-url=${LLM_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434/v1}}
app.ai.api-key=${LLM_API_KEY:${OLLAMA_API_KEY:}}
app.ai.fast-model=${LLM_SIMPLE_MODEL:${OLLAMA_SIMPLE_MODEL:llama3.1:8b}}
app.ai.complex-model=${LLM_COMPLEX_MODEL:${OLLAMA_COMPLEX_MODEL:deepseek-r1:8b}}
app.ai.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:10}
app.ai.request-timeout-seconds=${LLM_REQUEST_TIMEOUT_SECONDS:${LLM_TIMEOUT_SECONDS:60}}

# Asset import queue
app.asset.import.queue.max-concurrency=${ASSET_IMPORT_QUEUE_MAX_CONCURRENCY:4}
app.asset.import.queue.capacity=${ASSET_IMPORT_QUEUE_CAPACITY:50}

# Asset import validation
app.asset.import.validation.max-file-size-bytes=${ASSET_IMPORT_MAX_FILE_SIZE_BYTES:3145728}
app.asset.import.validation.max-pdf-pages=${ASSET_IMPORT_MAX_PDF_PAGES:10}
app.asset.import.validation.max-extracted-characters=${ASSET_IMPORT_MAX_EXTRACTED_CHARACTERS:15000}
app.asset.import.validation.max-extraction-processing-seconds=${ASSET_IMPORT_MAX_EXTRACTION_PROCESSING_SECONDS:15}
app.asset.import.validation.max-ai-processing-seconds=${ASSET_IMPORT_MAX_AI_PROCESSING_SECONDS:90}
app.asset.import.validation.max-detected-assets=${ASSET_IMPORT_MAX_DETECTED_ASSETS:25}

# Asset import ai queue
app.asset.import.ai.queue.max-concurrency=${ASSET_IMPORT_AI_QUEUE_MAX_CONCURRENCY:2}
app.asset.import.ai.queue.capacity=${ASSET_IMPORT_AI_QUEUE_CAPACITY:20}
app.asset.import.ai.queue.offer-timeout-seconds=${ASSET_IMPORT_AI_QUEUE_OFFER_TIMEOUT_SECONDS:5}

# Rate limit
app.rate-limit.rules.ASSET_IMPORT.max-requests=${ASSET_IMPORT_RATE_LIMIT_MAX_REQUESTS:4}
app.rate-limit.rules.ASSET_IMPORT.window-seconds=${ASSET_IMPORT_RATE_LIMIT_WINDOW_SECONDS:60}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Security surface defaults
app.security.docs-public=${SECURITY_DOCS_PUBLIC:false}
app.security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.hsts.include-sub-domains=${SECURITY_HSTS_INCLUDE_SUB_DOMAINS:true}
app.security.hsts.max-age-seconds=${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
app.security.prometheus.username=${PROMETHEUS_BASIC_AUTH_USERNAME:prometheus-scraper}
app.security.prometheus.password=${PROMETHEUS_PASSWORD:change-me}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
app.active-symbol.user-id-batch-size=${ACTIVE_SYMBOL_USER_ID_BATCH_SIZE:600}

# Kafka
kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:portfolio-service-active-users}
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tychewealth.kafka.events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.listener.retry-interval-ms=${KAFKA_LISTENER_RETRY_INTERVAL_MS:1000}
app.kafka.listener.retry-attempts=${KAFKA_LISTENER_RETRY_ATTEMPTS:2}
app.kafka.dlt.suffix=${KAFKA_DLT_SUFFIX:-dlt}
app.kafka.topic-partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.topic-replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}
app.kafka.topics.active-users=${KAFKA_TOPIC_ACTIVE_USERS:active-users}
app.kafka.topics.active-symbol-changes=${KAFKA_TOPIC_ACTIVE_SYMBOL_CHANGES:active-symbol-changes}
