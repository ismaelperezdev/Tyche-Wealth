# Default port
server.port=8082

spring.application.name=portfolio-service

# Optional import of unversioned local configuration.
# Support both running from the module directory and from the repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:../../application-local.properties

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog/changelog-master.xml

# PostgreSQL configuration
spring.datasource.url=${DB_URL_PORTFOLIO}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT
app.auth.jwt.secret=${JWT_SECRET}

# AI / Ollama
app.ai.base-url=${LLM_BASE_URL:${OLLAMA_BASE_URL:http://localhost:11434/v1}}
app.ai.api-key=${LLM_API_KEY:${OLLAMA_API_KEY:}}
app.ai.fast-model=${LLM_SIMPLE_MODEL:${OLLAMA_SIMPLE_MODEL:llama3.1:8b}}
app.ai.complex-model=${LLM_COMPLEX_MODEL:${OLLAMA_COMPLEX_MODEL:deepseek-r1:8b}}
app.ai.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:10}
app.ai.request-timeout-seconds=${LLM_REQUEST_TIMEOUT_SECONDS:${LLM_TIMEOUT_SECONDS:120}}

# Asset import queue
app.asset.import.queue.max-concurrency=${ASSET_IMPORT_QUEUE_MAX_CONCURRENCY:4}
app.asset.import.queue.capacity=${ASSET_IMPORT_QUEUE_CAPACITY:50}

# Asset import validation
app.asset.import.validation.max-file-size-bytes=${ASSET_IMPORT_MAX_FILE_SIZE_BYTES:3145728}
app.asset.import.validation.max-pdf-pages=${ASSET_IMPORT_MAX_PDF_PAGES:10}
app.asset.import.validation.max-extracted-characters=${ASSET_IMPORT_MAX_EXTRACTED_CHARACTERS:15000}
app.asset.import.validation.max-extraction-processing-seconds=${ASSET_IMPORT_MAX_EXTRACTION_PROCESSING_SECONDS:15}
app.asset.import.validation.max-ai-processing-seconds=${ASSET_IMPORT_MAX_AI_PROCESSING_SECONDS:90}
app.asset.import.validation.max-detected-assets=${ASSET_IMPORT_MAX_DETECTED_ASSETS:25}

# Asset import ai queue
app.asset.import.ai.queue.max-concurrency=${ASSET_IMPORT_AI_QUEUE_MAX_CONCURRENCY:2}
app.asset.import.ai.queue.capacity=${ASSET_IMPORT_AI_QUEUE_CAPACITY:20}

# Rate limit
app.rate-limit.rules.PORTFOLIO_CREATE.max-requests=${PORTFOLIO_CREATE_RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.rules.PORTFOLIO_CREATE.window-seconds=${PORTFOLIO_CREATE_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.rules.PORTFOLIO_UPDATE.max-requests=${PORTFOLIO_UPDATE_RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.rules.PORTFOLIO_UPDATE.window-seconds=${PORTFOLIO_UPDATE_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.rules.PORTFOLIO_LIST.max-requests=${PORTFOLIO_LIST_RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.rules.PORTFOLIO_LIST.window-seconds=${PORTFOLIO_LIST_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.rules.PORTFOLIO_RETRIEVE.max-requests=${PORTFOLIO_RETRIEVE_RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.rules.PORTFOLIO_RETRIEVE.window-seconds=${PORTFOLIO_RETRIEVE_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.rules.PORTFOLIO_DELETE.max-requests=${PORTFOLIO_DELETE_RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.rules.PORTFOLIO_DELETE.window-seconds=${PORTFOLIO_DELETE_RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.rules.ASSET_IMPORT.max-requests=${ASSET_IMPORT_RATE_LIMIT_MAX_REQUESTS:4}
app.rate-limit.rules.ASSET_IMPORT.window-seconds=${ASSET_IMPORT_RATE_LIMIT_WINDOW_SECONDS:60}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Security surface defaults
app.security.docs-public=${SECURITY_DOCS_PUBLIC:false}
app.security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.hsts.include-sub-domains=${SECURITY_HSTS_INCLUDE_SUB_DOMAINS:true}
app.security.hsts.max-age-seconds=${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
app.security.prometheus.username=${PROMETHEUS_BASIC_AUTH_USERNAME:prometheus-scraper}
app.security.prometheus.password=${PROMETHEUS_PASSWORD:change-me}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
