# Default port
server.port=8081

spring.application.name=portfolio-service

# Optional import of unversioned local configuration.
# Support both running from the module directory and from the repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:../../application-local.properties

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db.changelog/changelog-master.xml

# PostgreSQL configuration
spring.datasource.url=${DB_URL_PORTFOLIO}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Security surface defaults
app.security.docs-public=${SECURITY_DOCS_PUBLIC:false}
app.security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.prometheus.username=${PROMETHEUS_BASIC_AUTH_USERNAME:prometheus-scraper}
app.security.prometheus.password=${PROMETHEUS_PASSWORD:change-me}
