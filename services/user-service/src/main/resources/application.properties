# Default port
server.port=8080

spring.application.name=user-service

# Optional import of unversioned local configuration.
# Support both running from the module directory and from the repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:../../application-local.properties

# Liquibase - main changelog path
spring.liquibase.change-log=classpath:db.changelog/changelog-master.xml

# PostgreSQL configuration (uses environment variables or application-local.properties)
spring.datasource.url=${DB_URL_USER}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Liquibase manage schema creation and updates
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT login token config
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.auth.jwt.verify-email-token-ttl-seconds=${JWT_VERIFY_EMAIL_TOKEN_TTL_SECONDS:86400}
app.auth.jwt.verify-login-device-token-ttl-seconds=${JWT_VERIFY_LOGIN_DEVICE_TOKEN_TTL_SECONDS:86400}
app.auth.jwt.forgot-password-token-ttl-seconds=${JWT_FORGOT_PASSWORD_TOKEN_TTL_SECONDS:86400}
app.auth.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:86400}
app.auth.jwt.refresh-token-pepper=${JWT_REFRESH_TOKEN_PEPPER}
app.auth.verify-registration-url=${VERIFY_REGISTRATION_URL}
app.auth.verify-login-device-url=${VERIFY_LOGIN_DEVICE_URL}
app.auth.forgot-password-url=${FORGOT_PASSWORD_URL}

# Register endpoint protections
app.auth.register-rate-limit.max-requests=${AUTH_REGISTER_RATE_LIMIT_MAX_REQUESTS:15}
app.auth.register-rate-limit.window-seconds=${AUTH_REGISTER_RATE_LIMIT_WINDOW_SECONDS:300}

# Login endpoint protections
app.auth.login-rate-limit.max-requests=${AUTH_LOGIN_RATE_LIMIT_MAX_REQUESTS:20}
app.auth.login-rate-limit.window-seconds=${AUTH_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# Refresh endpoint protections aligned with app.auth.jwt.refresh-token-ttl-seconds / JWT_REFRESH_TOKEN_TTL_SECONDS
app.auth.refresh-rate-limit.max-requests=${AUTH_REFRESH_RATE_LIMIT_MAX_REQUESTS:60}
app.auth.refresh-rate-limit.window-seconds=${AUTH_REFRESH_RATE_LIMIT_WINDOW_SECONDS:60}

# Active user snapshot
app.active-users.snapshot.enabled=${ACTIVE_USERS_SNAPSHOT_ENABLED:true}
app.active-users.snapshot.fixed-delay=${ACTIVE_USERS_SNAPSHOT_FIXED_DELAY:5m}
app.active-users.snapshot.initial-delay=${ACTIVE_USERS_SNAPSHOT_INITIAL_DELAY:0s}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Security surface defaults
app.security.docs-public=${SECURITY_DOCS_PUBLIC:false}
app.security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.cookies.secure=${SECURITY_COOKIES_SECURE:true}
app.security.hsts.include-sub-domains=${SECURITY_HSTS_INCLUDE_SUB_DOMAINS:true}
app.security.hsts.max-age-seconds=${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
app.security.prometheus.username=${PROMETHEUS_BASIC_AUTH_USERNAME:prometheus-scraper}
app.security.prometheus.password=${PROMETHEUS_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Email / Resend
app.email.daily-limit=${EMAIL_DAILY_LIMIT:80}
app.email.resend.enabled=${EMAIL_RESEND_ENABLED:false}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${EMAIL_FROM:}
app.email.resend.base-url=${EMAIL_RESEND_BASE_URL:https://api.resend.com}
