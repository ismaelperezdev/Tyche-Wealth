<!DOCTYPE html>
<html>
  <body>
    <div
      style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; color: #111; line-height: 1.5;"
    >
      <h1 style="margin-bottom: 24px;">Tyche Wealth</h1>

      <h2 style="margin-bottom: 16px;">Confirm you want to change your password</h2>

      <p>Hi,</p>

      <p>We detected that you are trying to change your password.</p>

      <p>If this was you, confirm by clicking the button below:</p>

      <div style="text-align: center; margin: 32px 0;">
        <a
          href="{{verification_link}}"
          style="
            display: inline-block;
            background-color: #111;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
          "
        >
          Change password
        </a>
      </div>

      <p>If this wasn't you, don't click the link.</p>

      <p style="margin-top: 32px; font-size: 12px; color: #666;">
        This link will expire in {{expiration_text}}.
      </p>
    </div>
  </body>
</html>
