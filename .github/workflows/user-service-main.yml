name: User Service Main CI

on:
  push:
    branches:
      - main
    paths:
      - "services/user-service/**"
      - "pom.xml"
      - "mvnw"
      - "mvnw.cmd"
      - ".mvn/**"
      - ".github/workflows/user-service-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven wrapper
        run: chmod +x mvnw

      - name: Check format
        run: ./mvnw -pl services/user-service -am spotless:check

      - name: Check build
        run: ./mvnw -pl services/user-service -am -DskipTests package

      - name: Tests
        run: ./mvnw -pl services/user-service -am verify -Ddependency-check.skip=true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DEPENDENCY_CHECK_DATA_DIR: ~/.dependency-check-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('services/user-service/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        run: ./mvnw -pl services/user-service -am org.owasp:dependency-check-maven:check

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-dependency-check-main
          path: |
            services/user-service/target/dependency-check-report.html
            services/user-service/target/dependency-check-report.json
          if-no-files-found: ignore
