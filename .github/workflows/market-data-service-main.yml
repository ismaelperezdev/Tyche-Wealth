name: Market Data Service Main CI

on:
  push:
    branches:
      - main
    paths:
      - "services/market-data-service/**"
      - ".github/workflows/market-data-service-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven wrapper
        run: chmod +x mvnw

      - name: Check format
        run: ./mvnw -pl services/market-data-service -am spotless:check

      - name: Check build
        run: ./mvnw -pl services/market-data-service -am -DskipTests package

      - name: Tests
        run: ./mvnw -pl services/market-data-service -am verify -Ddependency-check.skip=true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DEPENDENCY_CHECK_DATA_DIR: ~/.dependency-check-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('services/market-data-service/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        run: ./mvnw -pl services/market-data-service -am org.owasp:dependency-check-maven:check

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-service-dependency-check-main
          path: |
            services/market-data-service/target/dependency-check-report.html
            services/market-data-service/target/dependency-check-report.json
          if-no-files-found: ignore
