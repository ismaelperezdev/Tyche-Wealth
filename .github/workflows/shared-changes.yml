name: Shared Changes CI

on:
  push:
    branches:
      - main
    paths:
      - "pom.xml"
      - "libraries/**"
      - "services/**"
      - "docker-compose.yml"
      - ".github/workflows/shared-changes.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "libraries/**"
      - "services/**"
      - "docker-compose.yml"
      - ".github/workflows/shared-changes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven wrapper
        run: chmod +x mvnw

      - name: Check format
        run: ./mvnw spotless:check

  security:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPENDENCY_CHECK_DATA_DIR: ~/.dependency-check-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Maven wrapper
        run: chmod +x mvnw

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:check
