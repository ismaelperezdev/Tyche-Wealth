name: Portfolio Service PR CI

on:
  pull_request:
    paths:
      - "pom.xml"
      - "services/portfolio-service/**"
      - "docker-compose.yml"
      - "docker/postgres/**"
      - "docker/prometheus/**"
      - "docker/grafana/**"
      - "observability/prometheus/**"
      - "observability/grafana/**"
      - "application-local.properties"
      - ".github/workflows/portfolio-service-pr.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    defaults:
      run:
        working-directory: services/portfolio-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven wrapper
        run: chmod +x mvnw

      - name: Check format
        run: ./mvnw spotless:check

      - name: Check build
        run: ./mvnw -DskipTests package

      - name: Tests
        run: ./mvnw test

      - name: Run SonarQube analysis
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw sonar:sonar -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.token=${SONAR_TOKEN}

      - name: Detect infra changes
        if: ${{ github.event_name == 'pull_request' }}
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            redis:
              - 'docker-compose.yml'
            postgres:
              - 'docker-compose.yml'
              - 'docker/postgres/**'
              - 'application-local.properties'
            prometheus:
              - 'docker-compose.yml'
              - 'docker/prometheus/**'
              - 'observability/prometheus/**'
              - 'application-local.properties'
            grafana:
              - 'docker-compose.yml'
              - 'docker/grafana/**'
              - 'observability/grafana/**'
              - 'application-local.properties'

      - name: Generate application-local.properties from GitHub secrets
        working-directory: ${{ github.workspace }}
        run: |
          cat > application-local.properties <<EOF
          DB_URL_USER=${{ secrets.DB_URL_USER }}
          DB_URL_PORTFOLIO=${{ secrets.DB_URL_PORTFOLIO }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_TOKEN_PEPPER=${{ secrets.JWT_REFRESH_TOKEN_PEPPER }}
          VERIFY_REGISTRATION_URL=${{ secrets.VERIFY_REGISTRATION_URL }}
          VERIFY_LOGIN_DEVICE_URL=${{ secrets.VERIFY_LOGIN_DEVICE_URL }}
          FORGOT_PASSWORD_URL=${{ secrets.FORGOT_PASSWORD_URL }}
          PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
          GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          EOF

      - name: Build and start Docker services
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          services="portfolio-service"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "${{ steps.changes.outputs.redis }}" = "true" ] && services="$services redis"
            [ "${{ steps.changes.outputs.postgres }}" = "true" ] && services="$services postgres"
            [ "${{ steps.changes.outputs.prometheus }}" = "true" ] && services="$services prometheus"
            [ "${{ steps.changes.outputs.grafana }}" = "true" ] && services="$services grafana"
          fi
          echo "Docker services to update: $services"
          docker compose up -d --build $services

      - name: Docker services status
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: docker compose ps

      - name: Cleanup temporary secrets file
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f application-local.properties

      - name: Append Closes issue to PR description
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const sources = [pr.title || "", pr.head?.ref || "", pr.body || ""].join("\n");
            const match = sources.match(/\b(TYCHE-\d+)\b/i);
            if (!match) {
              core.info("No TYCHE-XX token found in PR title/branch/body.");
              return;
            }

            const ticketKey = match[1].toUpperCase();
            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "[${ticketKey}]"`;
            const searchResult = await github.rest.search.issuesAndPullRequests({
              q: searchQuery,
              per_page: 10
            });

            const exactMatches = (searchResult.data.items || []).filter(
              (item) => item.title && item.title.toUpperCase().includes(`[${ticketKey}]`)
            );

            if (exactMatches.length === 0) {
              core.info(`No GitHub issue found with title token [${ticketKey}].`);
              return;
            }

            if (exactMatches.length > 1) {
              core.warning(`Multiple GitHub issues found for [${ticketKey}]. Skipping auto-close append.`);
              return;
            }

            const issueNumber = exactMatches[0].number;
            const closesLine = `Closes #${issueNumber}`;
            const body = pr.body || "";

            if (new RegExp(`\\bCloses\\s+#${issueNumber}\\b`, "i").test(body)) {
              core.info(`PR body already contains '${closesLine}'.`);
              return;
            }

            const updatedBody = body.trim().length === 0 ? closesLine : `${body.trim()}\n\n${closesLine}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: updatedBody
            });
            core.info(`Added '${closesLine}' to PR description.`);

      - name: Trigger CodeRabbit review
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "@coderabbitai review"
            });
