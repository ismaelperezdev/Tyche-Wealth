services:
  user-service:
    build:
      context: ./user-service
    container_name: tyche-user-service
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./application-local.properties:/app/application-local.properties:ro
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://host.docker.internal:5433/tyche_wealth_user}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tyche-network

  postgres:
    image: postgres:17
    container_name: tyche-postgres
    profiles:
      - db
    entrypoint:
      - /bin/sh
      - /etc/postgres/entrypoint.sh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tyche_wealth_user}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tyche_wealth_user}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./docker/postgres/entrypoint.sh:/etc/postgres/entrypoint.sh:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tyche-network

  redis:
    image: redis:8-alpine
    container_name: tyche-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tyche-network

  prometheus:
    image: prom/prometheus:latest
    container_name: tyche-prometheus
    entrypoint:
      - /bin/sh
      - /etc/prometheus/entrypoint.sh
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
    depends_on:
      - user-service
    networks:
      - tyche-network

  grafana:
    image: grafana/grafana:latest
    container_name: tyche-grafana
    entrypoint:
      - /bin/sh
      - /etc/grafana/entrypoint.sh
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tyche-network

networks:
  tyche-network:
    driver: bridge

volumes:
  grafana-data:
  postgres-data:
  redis-data:
