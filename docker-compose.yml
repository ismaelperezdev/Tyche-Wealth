services:
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: tyche-user-service
    env_file:
      - ./application-local.properties
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8080}:8080"
    volumes:
      - ./application-local.properties:/app/application-local.properties:ro
    environment:
      DB_URL_USER: ${DB_URL_USER:-jdbc:postgresql://postgres:5432/tyche_wealth_user}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tyche-network

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: tyche-portfolio-service
    env_file:
      - ./application-local.properties
    ports:
      - "127.0.0.1:${PORTFOLIO_SERVICE_PORT:-8082}:8082"
    volumes:
      - ./application-local.properties:/app/application-local.properties:ro
    environment:
      DB_URL_PORTFOLIO: ${DB_URL_PORTFOLIO:-jdbc:postgresql://postgres:5432/tyche_wealth_portfolio}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tyche-network

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    container_name: tyche-market-data-service
    env_file:
      - ./application-local.properties
    ports:
      - "127.0.0.1:${MARKET_DATA_SERVICE_PORT:-8081}:8081"
    volumes:
      - ./application-local.properties:/app/application-local.properties:ro
    environment:
      DB_URL_MARKET_DATA: ${DB_URL_MARKET_DATA:-jdbc:postgresql://postgres:5432/tyche_wealth_market_data}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tyche-network

  postgres:
    image: postgres:17
    container_name: tyche-postgres
    entrypoint:
      - /bin/sh
      - /etc/postgres/entrypoint.sh
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      DB_URL_MARKET_DATA: ${DB_URL_MARKET_DATA:-jdbc:postgresql://postgres:5432/tyche_wealth_market_data}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./docker/postgres/entrypoint.sh:/etc/postgres/entrypoint.sh:ro
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-init-multiple-databases.sh:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tyche-network

  redis:
    image: redis:8-alpine
    container_name: tyche-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tyche-network

  kafka:
    image: apache/kafka:3.8.1
    container_name: tyche-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - tyche-network

  akhq:
    image: tchiotludo/akhq:0.25.1
    container_name: tyche-akhq
    ports:
      - "127.0.0.1:${AKHQ_PORT:-8085}:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            tyche-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tyche-network

  prometheus:
    image: prom/prometheus:latest
    container_name: tyche-prometheus
    entrypoint:
      - /bin/sh
      - /etc/prometheus/entrypoint.sh
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
    depends_on:
      - user-service
      - portfolio-service
      - market-data-service
    networks:
      - tyche-network

  grafana:
    image: grafana/grafana:latest
    container_name: tyche-grafana
    entrypoint:
      - /bin/sh
      - /etc/grafana/entrypoint.sh
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./application-local.properties:/run/config/application-local.properties:ro
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - tyche-network

networks:
  tyche-network:
    driver: bridge

volumes:
  grafana-data:
  kafka-data:
  postgres-data:
  redis-data:
